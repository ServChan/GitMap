[package]
name = "gitmap"
version = "0.1.0"
edition = "2024"
description = "Карта веток git-репозиториев"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence"] }
gix = { version = "0.90.0", default-features = false, features = ["revision", "blob-diff", "parallel", "sha1"] }
rfd = { version = "0.17.2", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-manifest = "1.5.1"
winresource = "0.1.34"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[profile.dev.package."*"]
opt-level = 2
